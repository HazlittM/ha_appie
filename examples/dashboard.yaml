# Dashboardkaart met alleen standaard Home Assistant-kaarten (geen extra kaarten nodig).
# Plak dit in een kaart via "Handmatige kaart" of in de YAML van je dashboard.
# Dashboard card using only core Home Assistant cards.
type: vertical-stack
cards:
  - type: markdown
    content: "## Boodschappen"
  - type: entities
    title: Vaste producten
    show_header_toggle: false
    entities:
      - entity: button.ha_appie_voeg_vaste_producten_toe_aan_boodschappenlijst
        name: Vaste producten op lijst
      - entity: button.ha_appie_standaardaantallen_herstellen
        name: Standaardaantallen herstellen
      # Eén number per vast product; deze namen zijn voorbeelden. Gebruik 'Entiteiten toevoegen'
      # of filter op number.ha_appie_*.
      - number.ha_appie_ah_bananen_tros
      - number.ha_appie_ah_halfvolle_melk
  - type: entities
    title: Recept
    show_header_toggle: false
    entities:
      - entity: select.ha_appie_recept
        name: Kies recept
      - entity: number.ha_appie_recept_personen
        name: Aantal personen
      - entity: button.ha_appie_recept_op_boodschappenlijst
        name: Op boodschappenlijst
        secondary_info: none
  - type: entities
    title: Nieuw recept
    show_header_toggle: false
    entities:
      - entity: text.ha_appie_nieuw_recept_naam
        name: Naam
      - entity: number.ha_appie_nieuw_recept_personen
        name: Personen
      - entity: text.ha_appie_nieuw_recept_ingredienten
        name: Ingrediënten (met ; ertussen)
      - entity: button.ha_appie_nieuw_recept_opslaan
        name: Recept opslaan
  - type: todo-list
    entity: todo.ha_appie_recept_ingredienten
    title: Ingrediënten van het gekozen recept
  - type: entities
    title: Product zoeken
    show_header_toggle: false
    entities:
      - entity: text.ha_appie_zoek_product
        name: Zoekwoord (Enter)
      - entity: select.ha_appie_zoekresultaat
        name: Kies product
      - entity: number.ha_appie_zoek_aantal
        name: Aantal
      - entity: button.ha_appie_zoekresultaat_toevoegen
        name: Toevoegen aan lijst
      - type: section
        label: Vastzetten voor een recept-ingrediënt
      - entity: select.ha_appie_recept_ingredient_kiezen
        name: Ingrediënt
      - entity: button.ha_appie_zoekresultaat_vastzetten_bij_ingredient
        name: Gekozen product vastzetten
      - entity: button.ha_appie_ingredient_weer_automatisch_kiezen
        name: Weer automatisch kiezen
  - type: todo-list
    entity: todo.ha_appie_boodschappenlijst
    title: AH-boodschappenlijst
  - type: todo-list
    entity: todo.ha_appie_vertaallijst
    title: Vertaallijst (bv. cremé fraise = creme fraiche)
    hide_completed: false
